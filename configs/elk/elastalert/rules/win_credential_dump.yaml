name: win_lsass_credential_dump
index: windows-logs-*
type: any

filter:
  - bool:
      must:
        - term:
            winlog.event_id: "4663"
        - query_string:
            query: 'winlog.event_data.ObjectName:*lsass*'

realert:
  minutes: 5

alert:
  - hivealerter

hive_alert_config:
  title: "LSASS Memory Access Detected (Credential Dumping)"
  type: "external"
  source: "elastalert2"
  severity: 4
  tags:
    - "MITRE:T1003.001"
    - "windows"
    - "credential-access"
  tlp: 2
  status: "New"
  follow: true
  description: |
    A process attempted to access LSASS memory
    (MITRE T1003.001 - OS Credential Dumping: LSASS Memory).
    This is the primary technique used by tools like Mimikatz
    to extract plaintext passwords and hashes.

    - Host: {0}
    - Accessing Process: {1}
    - Target Object: {2}
    - Access Mask: {3}
    - Account: {4}
    - Timestamp: {5}

  description_args:
    - host.name
    - winlog.event_data.ProcessName
    - winlog.event_data.ObjectName
    - winlog.event_data.AccessMask
    - winlog.event_data.SubjectUserName
    - "@timestamp"

hive_observable_data_mapping:
  - other: "host.name"
  - other: "winlog.event_data.ProcessName"

alert_text_args:
  - host.name
  - winlog.event_data.ProcessName
  - winlog.event_data.ObjectName
  - winlog.event_data.AccessMask
  - winlog.event_data.SubjectUserName
  - "@timestamp"
alert_text_type: alert_text_only
